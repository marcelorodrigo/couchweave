baseURL = "https://couchweave.marcelorodrigo.com/"
title = "CouchWeave"
locale = "en-US"
defaultContentLanguage = "en"
enableRobotsTXT = true
capitalizeListTitles = false
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "Spring Data-compatible access to Apache CouchDB without hiding datastore semantics."
  repositoryURL = "https://github.com/marcelorodrigo/couchweave"
  issueURL = "https://github.com/marcelorodrigo/couchweave/issues"
  licenseURL = "https://github.com/marcelorodrigo/couchweave/blob/master/LICENSE"
  statusLabel = "Design phase"
  statusMessage = "CouchWeave does not publish usable artifacts yet."
  statusURL = "/roadmap/"

[[menus.main]]
  name = "Why CouchWeave"
  pageRef = "/why"
  weight = 10

[[menus.main]]
  name = "Roadmap"
  pageRef = "/roadmap"
  weight = 20

[[menus.main]]
  name = "Docs"
  pageRef = "/docs"
  weight = 30

[[menus.footer]]
  name = "Contributing"
  pageRef = "/contributing"
  weight = 10

[[menus.footer]]
  name = "Legal"
  pageRef = "/legal"
  weight = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = false

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = "assets/notwatching/hugo_stats\\.json"
    target = "css"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.164.0"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    disableWatch = true
    source = "hugo_stats.json"
    target = "assets/notwatching/hugo_stats.json"

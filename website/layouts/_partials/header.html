<header class="sticky top-0 z-40 border-b border-line/80 bg-canvas/90 backdrop-blur-xl">
  <div class="site-shell flex h-18 items-center justify-between gap-6">
    <a class="group flex items-center gap-3" href="/" aria-label="CouchWeave home">
      <img class="size-9 transition-transform group-hover:-rotate-3" src="/brand/couchweave-mark.svg" alt="" width="36" height="36">
      <span class="text-lg font-semibold tracking-[-0.025em]">CouchWeave</span>
    </a>
    <nav class="hidden items-center gap-1 md:flex" aria-label="Main navigation">
      {{ range site.Menus.main }}
        <a class="nav-link{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} nav-link-active{{ end }}" href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <a class="nav-link" href="{{ site.Params.repositoryURL }}">GitHub</a>
      {{ partial "theme-toggle.html" . }}
    </nav>
    <div class="flex items-center gap-2 md:hidden">
      {{ partial "theme-toggle.html" . }}
      <details class="mobile-menu relative">
        <summary class="icon-button" aria-label="Open navigation">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </summary>
        <nav class="absolute right-0 top-12 w-64 rounded-2xl border border-line bg-surface p-3 shadow-soft" aria-label="Mobile navigation">
          {{ range site.Menus.main }}
            <a class="mobile-nav-link" href="{{ .URL }}">{{ .Name }}</a>
          {{ end }}
          <a class="mobile-nav-link" href="{{ site.Params.repositoryURL }}">GitHub</a>
        </nav>
      </details>
    </div>
  </div>
</header>

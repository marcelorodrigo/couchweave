<aside class="border-b border-primary/20 bg-primary/8" aria-label="Project status">
  <div class="site-shell flex flex-wrap items-center justify-center gap-x-3 gap-y-1 py-2.5 text-center text-sm">
    <span class="rounded-full bg-primary/12 px-2.5 py-1 font-mono text-xs font-semibold uppercase tracking-wider text-primary">{{ site.Params.statusLabel }}</span>
    <span class="text-muted">{{ site.Params.statusMessage }}</span>
    <a class="font-semibold text-primary underline decoration-primary/30 underline-offset-4 hover:decoration-primary" href="{{ site.Params.statusURL }}">See the roadmap</a>
  </div>
</aside>

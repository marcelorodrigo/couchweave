<!doctype html>
<html lang="{{ site.Language.Locale }}" data-theme="system">
  <head>
    {{ partial "validate-content.html" . }}
    {{ partial "head.html" . }}
  </head>
  <body class="min-h-screen bg-canvas text-ink antialiased">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{ partial "header.html" . }}
    {{ partial "status-banner.html" . }}
    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
